{# Google AdSense 광고 슬롯. ADSENSE_CLIENT/슬롯 ID가 없으면 개발용 자리표시를 보여줍니다. #}
{% macro ad(slot, format='auto', cls='') -%}
  {% if cfg.ADSENSE_CLIENT and slot %}
  <div class="ad {{ cls }}">
    <span class="ad-label">광고</span>
    <ins class="adsbygoogle" style="display:block"
         data-ad-client="{{ cfg.ADSENSE_CLIENT }}" data-ad-slot="{{ slot }}"
         {% if format == 'fluid' %}data-ad-format="fluid" data-ad-layout="in-article"{% else %}data-ad-format="{{ format }}" data-full-width-responsive="true"{% endif %}></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>
  {% elif cfg.SHOW_AD_PLACEHOLDERS %}
  <div class="ad ad-placeholder {{ cls }}" aria-hidden="true">광고 영역 ({{ cls or format }})</div>
  {% endif %}
{%- endmacro %}
